name: Submit iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: Expo build id to send to TestFlight

jobs:
  submit:
    name: Send to TestFlight
    steps:
      - uses: eas/checkout
      - name: Install packages with the pinned pnpm
        run: npm install -g pnpm@10.26.1 && pnpm install --frozen-lockfile
      - name: Submit to TestFlight
        run: cd artifacts/mobile && npx --yes eas-cli@latest submit --platform ios --id ${{ github.event.inputs.build_id }} --profile production --non-interactive

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-supplied key that makes a write request replay-safe.
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    MemberKey:
      name: memberKey
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema:
        type: string
    RecurringId:
      name: recurringId
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    DeviceTokenParam:
      name: token
      in: path
      required: true
      schema:
        type: string
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
    ReceiptItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MutationCount:
      type: object
      properties:
        count:
          type: integer
      required:
        - count

    User:
      type: object
      required:
        - id
        - clerkUserId
        - name
        - avatarColor
        - defaultCurrency
        - createdAt
      properties:
        id:
          type: string
        clerkUserId:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarColor:
          type: string
        photo:
          type: ["string", "null"]
        defaultCurrency:
          type: string
        notifPrefs:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        avatarColor:
          type: string
        photo:
          type: ["string", "null"]
        defaultCurrency:
          type: string
        notifPrefs:
          type: object
          additionalProperties: true

    AccountDeletionResponse:
      type: object
      required:
        - status
        - recoveryUntil
        - confirmationEmailSent
      properties:
        status:
          type: string
          enum: [scheduled]
        recoveryUntil:
          type: string
          format: date-time
        confirmationEmailSent:
          type: boolean

    SplitDetail:
      type: object
      required:
        - memberKey
        - amount
      properties:
        memberKey:
          type: string
        amount:
          type: number
        percentage:
          type: ["number", "null"]
        paid:
          type: ["number", "null"]

    CustomItemization:
      type: object
      required:
        - id
        - searchTerm
        - category
      properties:
        id:
          type: string
        searchTerm:
          type: string
          minLength: 1
        category:
          type: string

    Group:
      type: object
      required:
        - id
        - name
        - emoji
        - currency
        - type
        - createdByUserId
        - isArchived
        - isEnded
         - customItemizations
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: string
        currency:
          type: string
        type:
          type: string
        simplifyDebtsEnabled:
          type: boolean
        createdByUserId:
          type: string
        isArchived:
          type: boolean
        archivedAt:
          type: ["string", "null"]
          format: date-time
        isEnded:
          type: boolean
        endedAt:
          type: ["string", "null"]
          format: date-time
        reminderDays:
          type: ["integer", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        tripStartReminderDays:
          type: ["integer", "null"]
        settleUpReminderDays:
          type: ["integer", "null"]
        reminderChannel:
          type: ["string", "null"]
        nudgeCampaign:
          type: ["object", "null"]
          additionalProperties: true
        customItemizations:
          type: array
          items:
            $ref: "#/components/schemas/CustomItemization"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        emoji:
          type: string
        currency:
          type: string
        type:
          type: string
        simplifyDebtsEnabled:
          type: boolean
        startDate:
          type: string
        endDate:
          type: string
        reminderDays:
          type: integer
        tripStartReminderDays:
          type: integer
        settleUpReminderDays:
          type: integer
        reminderChannel:
          type: string
        nudgeCampaign:
          type: object
          additionalProperties: true
        customItemizations:
          type: array
          items:
            $ref: "#/components/schemas/CustomItemization"
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberInput"

    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        emoji:
          type: string
        currency:
          type: string
        type:
          type: string
        simplifyDebtsEnabled:
          type: boolean
        isArchived:
          type: boolean
        isEnded:
          type: boolean
        reminderDays:
          type: integer
        startDate:
          type: string
        endDate:
          type: string
        tripStartReminderDays:
          type: integer
        settleUpReminderDays:
          type: integer
        reminderChannel:
          type: string
        nudgeCampaign:
          type: object
          additionalProperties: true
        customItemizations:
          type: array
          items:
            $ref: "#/components/schemas/CustomItemization"

    GroupMember:
      type: object
      required:
        - id
        - groupId
        - memberKey
        - name
        - avatarColor
        - isAdmin
        - isPending
      properties:
        id:
          type: string
        groupId:
          type: string
        userId:
          type: ["string", "null"]
        memberKey:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarColor:
          type: string
        photo:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        isPending:
          type: boolean
        joinedAt:
          type: ["string", "null"]
          format: date-time

    GroupMemberInput:
      type: object
      required:
        - name
      properties:
        memberKey:
          type: string
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        avatarColor:
          type: string
        photo:
          type: string
        isAdmin:
          type: boolean
        isPending:
          type: boolean

    GroupInvitation:
      type: object
      required:
        - id
        - groupId
        - inviterUserId

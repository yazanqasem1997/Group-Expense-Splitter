openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SplitEasy production backend API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Current user and bootstrap
  - name: groups
    description: Group, membership and invitation operations
  - name: expenses
    description: Expense, split and comment operations
  - name: receipts
    description: Receipt OCR, line items and claims
  - name: settlements
    description: Settlement operations
  - name: recurring
    description: Recurring expense schedule operations
  - name: messages
    description: Group message operations
  - name: notifications
    description: Notification and device token operations
  - name: imports
    description: Bulk import / bootstrap operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the authenticated user profile (provisioning it if needed)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteCurrentUser
      tags: [users]
      summary: Schedule the authenticated account for deletion
      description: Deactivates the account immediately, allows recovery by signing in for 30 days, and permanently deletes it afterward.
      responses:
        "202":
          description: Account deletion scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /contacts/match:
    post:
      operationId: matchContacts
      tags: [users]
      summary: Match user-provided contact email addresses to active accounts
      description: Email addresses are used for this request only and are not retained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMatchInput"
      responses:
        "200":
          description: Matching active accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile-photo/upload-url:
    post:
      operationId: requestProfilePhotoUploadUrl
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoUploadInput"
      responses:
        "200":
          description: Short-lived upload URL and stable photo URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoUploadTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/profile-photo/complete:
    post:
      operationId: completeProfilePhotoUpload
      tags: [users]
      responses:
        "200":
          description: Saved profile photo URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile-photos/{userId}:
    get:
      operationId: getProfilePhoto
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Photo not found

  /friend-requests:
    get:
      operationId: listFriendRequests
      tags: [users]
      responses:
        "200":
          description: Requests involving the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: sendFriendRequest
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestInput"
      responses:
        "201":
          description: Friend request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A request is already pending or users are already friends
  /friend-invite:
    get:
      operationId: getFriendInvitePage
      tags: [users]
      security: []
      description: Public HTML page opened from a friend QR code; guides people to install the app and open the invite.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite page
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid or expired invite page
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Inviter account unavailable
          content:
            text/html:
              schema:
                type: string
  /friend-qr:
    post:
      operationId: createFriendQr
      tags: [users]
      responses:
        "201":
          description: Short-lived, opaque friend QR token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendQrToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /friend-qr/preview:
    post:
      operationId: previewFriendQr
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendQrTokenInput"
      responses:
        "200":
          description: Public profile associated with a valid friend QR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendQrProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /friend-requests/qr:
    post:
      operationId: sendFriendRequestWithQr
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendQrTokenInput"
      responses:
        "201":
          description: Friend request sent to the QR owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A request is already pending or users are already friends
  /friend-requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /friend-requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{groupId}/trip-pass/redeem:
    post:
      operationId: redeemTripPass
      tags: [users]
      summary: Use a free Trip Pass on a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanUsage"
        "400":
          description: No free Trip Pass available
  /me/invite-reward:
    post:
      operationId: claimInviteReward
      tags: [users]
      summary: Pick what one invite reward becomes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRewardChoice"
      responses:
        "200":
          description: Updated usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanUsage"
        "400":
          description: No reward to claim
  /me/usage:
    get:
      operationId: getScanUsage
      tags: [users]
      summary: Receipt scans used this month and the plan that applies
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Scan usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /client-errors:
    post:
      operationId: reportClientError
      tags: [users]
      summary: Record a crash or error from the app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorInput"
      responses:
        "204":
          description: Recorded
  /me/bootstrap:
    get:
      operationId: bootstrap
      tags: [users]
      summary: Fetch the full application snapshot for the authenticated user
      responses:
        "200":
          description: Full snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /imports:
    post:
      operationId: importSnapshot
      tags: [imports]
      summary: Bulk import a client snapshot (idempotent via Idempotency-Key)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      responses:
        "200":
          description: Groups the user belongs to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGroup
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateGroup
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGroup
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addGroupMember
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberInput"
      responses:
        "201":
          description: Added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{groupId}/members/{memberKey}:
    patch:
      operationId: updateGroupMember
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MemberKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAdmin]
              properties:
                isAdmin:
                  type: boolean
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeGroupMember
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MemberKey"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /groups/{groupId}/invitations:
    get:
      operationId: listGroupInvitations
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createGroupInvitation
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInvitationInput"
      responses:
        "201":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{groupId}/join-link:
    post:
      operationId: createGroupJoinLink
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "201":
          description: Created group join link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupJoinLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{groupId}/join-link/refresh:
    post:
      operationId: refreshGroupJoinLink
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Rotated group join link; previous link is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupJoinLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /group-join/{token}:
    get:
      operationId: previewGroupJoin
      tags: [groups]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public group information for a join preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupJoinPreview"
        "404":
          $ref: "#/components/responses/NotFound"

  /group-join/{token}/accept:
    post:
      operationId: acceptGroupJoin
      tags: [groups]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupJoinPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: Accepted invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /invitations/app:
    post:
      operationId: sendAppInvitation
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInvitationInput"
      responses:
        "204":
          description: Invitation email sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Email provider rejected the invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{token}/decline:
    post:
      operationId: declineInvitation
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: Declined invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{groupId}/expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createExpense
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /expenses/{expenseId}:
    get:
      operationId: getExpense
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateExpense
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /expenses/{expenseId}/comments:
    post:
      operationId: addExpenseComment
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCommentInput"
      responses:
        "201":
          description: Added comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{groupId}/receipts/upload-url:
    post:
      operationId: createReceiptUploadUrl
      tags: [receipts]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptUploadUrlInput"
      responses:
        "200":
          description: Signed receipt image upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptUploadUrl"
        "400":
